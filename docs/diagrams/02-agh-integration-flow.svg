<svg viewBox="0 0 680 940" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>AGH 集成全流程：从安装到审计包</title>
<desc>十一步竖向时序：一次性准备七步（构建、验证、inspect、add、trust、enable、环境变量），会话四步（会话、故障演示、导出、审计包）。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="28" font-size="15" font-weight="500" fill="#444441" text-anchor="middle">从安装到审计包：AGH 集成全流程</text>
<text x="340" y="46" font-size="12" fill="#5F5E5A" text-anchor="middle">— 一次性准备 —</text>
<g>
<rect x="60" y="60" width="560" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="76" y="82" font-size="14" font-weight="500" fill="#0C447C">① 构建 AGH</text>
<text x="76" y="100" font-size="12" fill="#185FA5">pnpm --filter @agnes/cli build:local → dist/local/agnes.mjs</text>
</g>
<g>
<rect x="60" y="138" width="560" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="76" y="160" font-size="14" font-weight="500" fill="#0C447C">② 验证模型 provider</text>
<text x="76" y="178" font-size="12" fill="#185FA5">agh doctor provider --probe → ✓ verified</text>
</g>
<g>
<rect x="60" y="216" width="560" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="76" y="238" font-size="14" font-weight="500" fill="#0C447C">③ 校验插件源</text>
<text x="76" y="256" font-size="12" fill="#185FA5">package inspect file:./plugins/paper-agent-tools → integrity + capabilityHash</text>
</g>
<g>
<rect x="60" y="294" width="560" height="56" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="76" y="316" font-size="14" font-weight="500" fill="#0C447C">④ ★ 安装插件（必须人工确认）</text>
<text x="76" y="334" font-size="12" fill="#0C447C">package add — 真实终端输入 y · AGH 安全设计无 bypass</text>
</g>
<g>
<rect x="60" y="372" width="560" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="76" y="394" font-size="14" font-weight="500" fill="#0C447C">⑤ 信任插件</text>
<text x="76" y="412" font-size="12" fill="#185FA5">package trust paper-agent-tools &lt;integrity&gt; &lt;capabilityHash&gt;</text>
</g>
<g>
<rect x="60" y="450" width="560" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="76" y="472" font-size="14" font-weight="500" fill="#0C447C">⑥ 启用插件</text>
<text x="76" y="490" font-size="12" fill="#185FA5">package enable → desired=enabled · actual=running · trusted=true</text>
</g>
<g>
<rect x="60" y="528" width="560" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="76" y="550" font-size="14" font-weight="500" fill="#0C447C">⑦ 注入环境变量</text>
<text x="76" y="568" font-size="12" fill="#185FA5">paper-agent_PYTHON=&lt;Python&gt; · paper-agent_ROOT=&lt;项目根&gt;</text>
</g>
<text x="340" y="614" font-size="12" fill="#5F5E5A" text-anchor="middle">— 每次会话 —</text>
<g>
<rect x="60" y="628" width="560" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="76" y="650" font-size="14" font-weight="500" fill="#085041">⑧ 发起科研会话</text>
<text x="76" y="668" font-size="12" fill="#0F6E56">agnes -p --cwd . "目标" → LLM 调用 sciret_*：P1…P5 → verify → report → cite</text>
</g>
<g>
<rect x="60" y="706" width="560" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="76" y="728" font-size="14" font-weight="500" fill="#085041">⑨ 故障演示轮（可选）</text>
<text x="76" y="746" font-size="12" fill="#0F6E56">run_step P2 chaos=kill_after_p2 → 进程 exit 137 → resume 续跑 DONE</text>
</g>
<g>
<rect x="60" y="784" width="560" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="76" y="806" font-size="14" font-weight="500" fill="#085041">⑩ 导出会话证据</text>
<text x="76" y="824" font-size="12" fill="#0F6E56">agnes export &lt;SESSION_ID&gt; --format agnes -o evidence/session.jsonl</text>
</g>
<g>
<rect x="60" y="862" width="560" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="76" y="884" font-size="14" font-weight="500" fill="#085041">⑪ 归集审计包</text>
<text x="76" y="902" font-size="12" fill="#0F6E56">build_audit_pack.sh &lt;RUN_ID&gt; → 双账本 + verification + report 打包</text>
</g>
<line x1="340" y1="116" x2="340" y2="134" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="194" x2="340" y2="212" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="272" x2="340" y2="290" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="350" x2="340" y2="368" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="428" x2="340" y2="446" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="506" x2="340" y2="524" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="584" x2="340" y2="602" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="684" x2="340" y2="702" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="762" x2="340" y2="780" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="840" x2="340" y2="858" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>

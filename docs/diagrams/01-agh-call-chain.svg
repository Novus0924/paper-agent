<svg viewBox="0 0 680 724" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>paper-agent 装入 AGH 后的端到端调用链</title>
<desc>从用户命令到实验子进程的八层竖向调用链，结果以 JSON 向上回流为 tool/result。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="320" y="28" font-size="15" font-weight="500" fill="#444441" text-anchor="middle">paper-agent × AGH 端到端调用链</text>
<g>
<rect x="50" y="50" width="540" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="66" y="72" font-size="14" font-weight="500" fill="#0C447C">用户 / 终端</text>
<text x="66" y="90" font-size="12" fill="#185FA5">agnes -p --cwd &lt;项目根&gt; "用 sciret_* 完成科研流水线"</text>
</g>
<g>
<rect x="50" y="134" width="540" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="66" y="156" font-size="14" font-weight="500" fill="#0C447C">AGH daemon 会话（LLM 编排）</text>
<text x="66" y="174" font-size="12" fill="#185FA5">模型 Agnes 3.0 Flash · 仅做工具编排，不产科学数据</text>
</g>
<g>
<rect x="50" y="218" width="540" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="66" y="240" font-size="14" font-weight="500" fill="#0C447C">工具调用 tool/call</text>
<text x="66" y="258" font-size="12" fill="#185FA5">sciret_plan · run_step · status · verify · report · cite · resume</text>
</g>
<g>
<rect x="50" y="302" width="540" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="66" y="324" font-size="14" font-weight="500" fill="#085041">插件 paper-agent-tools（trusted + running）</text>
<text x="66" y="342" font-size="12" fill="#0F6E56">JS 薄壳：参数序列化 · spawn 子进程 · 包装 tool/result</text>
</g>
<g>
<rect x="50" y="386" width="540" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="66" y="408" font-size="14" font-weight="500" fill="#085041">环境变量注入</text>
<text x="66" y="426" font-size="12" fill="#0F6E56">paper-agent_PYTHON=&lt;解释器&gt; · paper-agent_ROOT=&lt;项目根&gt;</text>
</g>
<g>
<rect x="50" y="470" width="540" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="66" y="492" font-size="14" font-weight="500" fill="#085041">Python CLI 入口</text>
<text x="66" y="510" font-size="12" fill="#0F6E56">python -m paper_agent.cli &lt;子命令&gt; · stdout 单 JSON · UTF-8 强制</text>
</g>
<g>
<rect x="50" y="554" width="540" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="66" y="576" font-size="14" font-weight="500" fill="#085041">核心编排 core/paper_agent</text>
<text x="66" y="594" font-size="12" fill="#0F6E56">状态机 · 步骤调度 · 证据账本 · 故障注入 · 事件留痕</text>
</g>
<g>
<rect x="50" y="638" width="540" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="66" y="660" font-size="14" font-weight="500" fill="#085041">实验子进程（每次独立 spawn）</text>
<text x="66" y="678" font-size="12" fill="#0F6E56">arrhenius_rank.py --input &lt;clean.csv&gt; --seed 0 · 确定性输出</text>
</g>
<line x1="320" y1="106" x2="320" y2="130" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="320" y1="190" x2="320" y2="214" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="320" y1="274" x2="320" y2="298" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="320" y1="358" x2="320" y2="382" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="320" y1="442" x2="320" y2="466" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="320" y1="526" x2="320" y2="550" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="320" y1="610" x2="320" y2="634" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M615 498 L615 246" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="615" y="372" font-size="11" fill="#5F5E5A" text-anchor="middle">tool/result</text>
</svg>

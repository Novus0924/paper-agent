<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>paper-agent 2.0 · 科研工作台（Demo）</title>
  <meta name="description" content="paper-agent 2.0 科研工作台高完成度交互原型（全假数据、零依赖、离线可运行）" />
  <!-- 内联 favicon（琥珀圆角块），避免 /favicon.ico 404 噪声 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%23D9A441'/></svg>" />
  <!-- 设计令牌须先于组件样式加载 -->
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <!-- 外壳：app.js 注入 侧边导航 + 顶部上下文栏 + 主内容区 -->
  <div id="app" class="app"></div>

  <!-- 经典 <script src> 顺序加载（勿用 type="module"，以保证 file:// 双击可用）
       顺序：常量 → 数据 → UI 原语 → 状态 → 适配层 → 视图 → 应用 -->
  <script src="assets/constants.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/components.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/views.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
